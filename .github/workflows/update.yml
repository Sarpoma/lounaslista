name: Update lunch menus

on:
  schedule:
    # These times are deliberately far earlier than the hours we actually
    # want. Measured over three weeks on this repo, GitHub starts scheduled
    # runs 5 to 7.5 hours after the requested time, and the lag has been
    # growing - a 03:10 UTC request was landing around 09:40 UTC. Asking for
    # lunch-time is therefore useless; we ask for the small hours and let the
    # queue deliver it before lunch.
    #
    # Firing several times is the hedge. A run that finds nothing new takes
    # about 30 seconds, commits nothing, and costs nothing on a public repo,
    # so the only thing extra runs buy is a better chance that one of them
    # lands early. All times UTC; add 3h for EEST, 2h for EET.
    - cron: "0 22 * * 0-4"   # evening before -> lands ~06:00-09:00 Helsinki
    - cron: "0 1 * * 1-5"    #              -> lands ~09:00-12:00 Helsinki
    - cron: "0 4 * * 1-5"    # backstop, about where the old schedule landed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape menus
        run: python3 -m scrape

      - name: Commit if the menus changed
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No menu changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update menus ($(date +%F\ %H:%M))"
          git push
