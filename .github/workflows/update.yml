name: Update lunch menus

on:
  schedule:
    # 06:10 and 09:10 Helsinki time (summer). GitHub cron is UTC and runs
    # are often a few minutes late under load, which is fine here.
    - cron: "10 3 * * 1-5"
    - cron: "10 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape menus
        run: python3 -m scrape

      - name: Commit if the menus changed
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No menu changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update menus ($(date +%F\ %H:%M))"
          git push
